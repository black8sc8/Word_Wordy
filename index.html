<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jelly Sentence 🌈</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">
    <h1>🌈 Jelly Sentence 🌈</h1>
    
    <div class="top-panel">
        <div class="level-select">
            <button id="btnEasy" class="level-btn active" onclick="setLevel('easy')">🐣 초급</button>
            <button id="btnMedium" class="level-btn" onclick="setLevel('medium')">🐥 중급</button>
            <button id="btnHard" class="level-btn" onclick="setLevel('hard')">🦅 상급</button>
        </div>
        <div class="score-board">⭐ 점수: <span id="score">0</span></div>
    </div>

    <div id="questionBox" class="question-box">
        여기에 문제가 나와요!
    </div>

    <div class="area-title">👇 여기에 단어를 순서대로 놓아주세요 👇</div>
    <div id="answerArea" class="drop-area"></div>

    <div class="area-title">👇 단어 블록을 클릭하세요 👇</div>
    <div id="wordPool" class="word-pool"></div>

    <div id="feedbackMessage" class="feedback-message"></div>
</div>

<script src="script.js" defer></script>

</body>
</html>
