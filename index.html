<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>말랑말랑 영어 놀이터 🌈</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">
    <h1>🌈 말랑말랑 영어 놀이터 🌈</h1>
    <div class="score-board">⭐ 맞춘 개수: <span id="score">0</span>개</div>

    <div id="questionBox" class="question-box">
        여기에 문제가 나와요!
    </div>

    <div class="area-title">👇 여기에 단어를 순서대로 놓아주세요 👇</div>
    <div id="answerArea" class="drop-area"></div>

    <div class="area-title">👇 단어 블록을 클릭하세요 👇</div>
    <div id="wordPool" class="word-pool"></div>

    <!-- 🌟 팝업 대신 화면에 나오는 메시지 창 -->
    <div id="feedbackMessage" class="feedback-message"></div>

    <button class="action-btn" onclick="checkAnswer()">정답 확인하기 🔍</button>
</div>

<script src="script.js" defer></script>

</body>
</html>
